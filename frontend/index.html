<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbrella — Word Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header { padding: 1.5rem; text-align: center; }
    h1 { font-size: 2rem; color: #60a5fa; letter-spacing: 0.05em; }
    p.sub { color: #9ca3af; font-size: 0.9rem; margin-top: 0.4rem; }
    #canvas-wrap {
      width: 100%;
      max-width: 960px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#wc { display: block; }
    #status { font-size: 0.78rem; color: #6b7280; padding: 0.8rem 0; }
    #qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.2rem 1.5rem 2rem;
    }
    #qr-section p { font-size: 0.85rem; color: #9ca3af; }
    #qr-canvas { border-radius: 0.5rem; }
    #qr-url { font-size: 0.75rem; color: #4b5563; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <h1>&#9730; Umbrella</h1>
    <p class="sub">Scan the QR code to add your word</p>
  </header>

  <div id="canvas-wrap">
    <canvas id="wc" width="960" height="520"></canvas>
  </div>

  <div id="status">Connecting…</div>

  <div id="qr-section">
    <p>Scan to submit a word</p>
    <canvas id="qr-canvas"></canvas>
    <span id="qr-url"></span>
  </div>

  <!--
    wordcloud2.js — MIT licence
    https://github.com/timdream/wordcloud2.js
  -->
  <script src="https://cdn.jsdelivr.net/npm/wordcloud2@1.2.2/src/wordcloud2.js"></script>
  <!--
    qrcode — MIT licence
    https://github.com/soldair/node-qrcode
  -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    // ----------------------------------------------------------------
    // API_BASE is replaced at SWA deploy time via the Azure Static Web Apps
    // app setting "API_BASE" (Azure Portal → SWA → Configuration).
    // Format: https://<apim-name>.azure-api.net
    // For local dev, replace '__API_BASE__' with the actual URL here.
    // ----------------------------------------------------------------
    const API_BASE = '__API_BASE__'.replace(/\/$/, '');

    const canvas   = document.getElementById('wc');
    const statusEl = document.getElementById('status');

    let lastRenderHash = '';

    function hashWords(data) {
      return data.map(w => `${w.text}:${w.count}`).join(',');
    }

    function renderCloud(data) {
      const list = data.map(({ text, count }) => [text, Math.max(count * 12, 14)]);
      WordCloud(canvas, {
        list,
        gridSize: 10,
        weightFactor: 1,
        fontFamily: 'Segoe UI, Tahoma, sans-serif',
        color: () => `hsl(${Math.floor(Math.random() * 360)}, 65%, 60%)`,
        backgroundColor: '#0f0f0f',
        rotateRatio: 0.3,
        minSize: 10,
        drawOutOfBound: false,
      });
    }

    async function fetchWords() {
      try {
        const resp = await fetch(`${API_BASE}/words`, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const h = hashWords(data);
        if (h !== lastRenderHash) {
          lastRenderHash = h;
          renderCloud(data);
        }
        statusEl.textContent =
          `${data.length} word${data.length !== 1 ? 's' : ''} · refreshed ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        statusEl.textContent = `Connection error: ${err.message}`;
      }
    }

    // Generate QR code pointing to the /submit page on this same origin
    const submitUrl = window.location.origin + '/submit';
    document.getElementById('qr-url').textContent = submitUrl;
    QRCode.toCanvas(document.getElementById('qr-canvas'), submitUrl, {
      width: 180,
      color: { dark: '#ffffff', light: '#0f0f0f' },
    });

    // Initial load + 3-second polling
    fetchWords();
    setInterval(fetchWords, 3000);
  </script>
</body>
</html>
