<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbrella — Word Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --iris:       #7C63A8;
      --iris-soft:  #A688D4;
      --iris-deep:  #5C4888;
      --teal:       #3AAFA9;
      --teal-soft:  #60CECA;
      --amber:      #C47F55;
      --bg:         #1A1714;
      --surface:    #231F1B;
      --surface-2:  #2D2924;
      --border:     #3D3830;
      --text-1:     #F0E8DC;
      --text-2:     #9A9088;
      --text-3:     #6A6258;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .header-title {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--iris);
      letter-spacing: -0.02em;
    }

    .header-sub {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.68rem;
      color: var(--text-3);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-left: auto;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .left-panel {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
      border-right: 1px solid var(--border);
      background: var(--surface);
      gap: 1.25rem;
    }

    .qr-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--teal);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    #qr-canvas {
      border-radius: 8px;
      overflow: hidden;
    }

    #qr-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: var(--text-3);
      word-break: break-all;
      text-align: center;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    .btn-clear {
      width: 100%;
      padding: 0.55rem 1.3rem;
      border-radius: 8px;
      background: transparent;
      color: var(--iris);
      border: 1px solid var(--iris);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-clear:hover {
      background: var(--iris);
      color: #fff;
    }

    #status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-3);
      text-align: center;
      letter-spacing: 0.05em;
      min-height: 1.2rem;
    }

    .cloud-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas#wc { display: block; }
  </style>
</head>
<body>
  <header>
    <span class="header-title">&#9730; Umbrella</span>
    <span class="header-sub">Live word cloud</span>
  </header>

  <div class="main-layout">
    <aside class="left-panel">
      <span class="qr-label">Scan to participate</span>
      <div id="qr-canvas"></div>
      <span id="qr-url"></span>
      <div class="divider"></div>
      <button class="btn-clear" id="clear-btn">Clear cloud</button>
      <div id="status">Connecting…</div>
    </aside>

    <div class="cloud-panel">
      <canvas id="wc" width="900" height="540"></canvas>
    </div>
  </div>

  <!--
    wordcloud2.js — MIT licence
    https://github.com/timdream/wordcloud2.js
  -->
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
  <!--
    qrcodejs — MIT licence
    https://github.com/davidshimjs/qrcodejs
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // ----------------------------------------------------------------
    // API_BASE is replaced at SWA deploy time via the Azure Static Web Apps
    // app setting "API_BASE" (Azure Portal → SWA → Configuration).
    // Format: https://<apim-name>.azure-api.net
    // For local dev, replace '__API_BASE__' with the actual URL here.
    // ----------------------------------------------------------------
    const API_BASE = '__API_BASE__'.replace(/\/$/, '');

    const canvas   = document.getElementById('wc');
    const statusEl = document.getElementById('status');

    let lastRenderHash = '';

    function hashWords(data) {
      return data.map(w => `${w.text}:${w.count}`).join(',');
    }

    const brandColors = ['#7C63A8', '#A688D4', '#3AAFA9', '#60CECA', '#C47F55'];

    // Font size range (px) tuned for up to ~50 entries:
    // the most-voted word gets MAX_FONT, the least-voted gets MIN_FONT.
    const MIN_FONT = 18;
    const MAX_FONT = 80;

    function renderCloud(data) {
      if (data.length === 0) return;

      // Sort highest count first so normalization is stable.
      const entries = [...data].sort((a, b) => b.count - a.count);

      // Normalize counts to [MIN_FONT, MAX_FONT] so the cloud always fills
      // the canvas well regardless of how spread the counts are.
      const maxCount = entries[0].count;
      const minCount = entries[entries.length - 1].count;
      const countRange = maxCount - minCount || 1;

      const list = entries.map(({ text, count }) => {
        const normalized = (count - minCount) / countRange;
        const size = Math.round(MIN_FONT + normalized * (MAX_FONT - MIN_FONT));
        return [text, size];
      });

      WordCloud(canvas, {
        list,
        gridSize: 8,
        weightFactor: 1,
        fontFamily: "'Sora', system-ui, sans-serif",
        color: () => brandColors[Math.floor(Math.random() * brandColors.length)],
        backgroundColor: '#1A1714',
        rotateRatio: 0.3,
        minSize: MIN_FONT,
        drawOutOfBound: false,
      });
    }

    async function fetchWords() {
      try {
        const resp = await fetch(`${API_BASE}/words`, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const h = hashWords(data);
        if (h !== lastRenderHash) {
          lastRenderHash = h;
          renderCloud(data);
        }
        statusEl.textContent =
          `${data.length} word${data.length !== 1 ? 's' : ''} · ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    // Generate QR code pointing to the /submit page on this same origin
    const submitUrl = window.location.origin + '/submit';
    document.getElementById('qr-url').textContent = submitUrl;
    new QRCode(document.getElementById('qr-canvas'), {
      text: submitUrl,
      width: 180,
      height: 180,
      colorDark: '#F0E8DC',
      colorLight: '#231F1B',
      correctLevel: QRCode.CorrectLevel.H,
    });

    // Clear button — calls DELETE /words to reset the cloud
    document.getElementById('clear-btn').addEventListener('click', async () => {
      if (!confirm('Clear all words from the cloud?')) return;
      try {
        const resp = await fetch(`${API_BASE}/words`, { method: 'DELETE' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        lastRenderHash = '';
        fetchWords();
      } catch (err) {
        statusEl.textContent = `Clear failed: ${err.message}`;
      }
    });

    // Initial load + 3-second polling
    fetchWords();
    setInterval(fetchWords, 3000);
  </script>
</body>
</html>
