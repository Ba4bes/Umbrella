name: Deploy Umbrella

on:
  push:
    branches:
      - main    # deploys fixed.bicep
      - broken  # deploys broken.bicep
  workflow_dispatch:
    inputs:
      bicep_variant:
        description: 'Bicep variant to deploy'
        required: true
        default: 'broken'
        type: choice
        options:
          - broken
          - fixed

env:
  DOTNET_VERSION: '10.x'

jobs:
  # ── 1. Build & publish the .NET app ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/UmbrellaApi/UmbrellaApi.csproj

      - name: Build
        run: >
          dotnet build backend/UmbrellaApi/UmbrellaApi.csproj
          --configuration Release
          --no-restore

      - name: Publish
        run: >
          dotnet publish backend/UmbrellaApi/UmbrellaApi.csproj
          --configuration Release
          --output ./publish
          --no-build

      - name: Zip publish output
        run: |
          cd publish
          zip -r ../app.zip .

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 1

  # ── 2. Deploy infrastructure (Bicep) ─────────────────────────────────────
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    outputs:
      apim_url: ${{ steps.bicep.outputs.apimGatewayUrl }}
      swa_host: ${{ steps.bicep.outputs.swaDefaultHost }}
      app_name: ${{ steps.bicep.outputs.appName }}
      swa_name: ${{ steps.bicep.outputs.swaName }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Bicep variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "file=${{ inputs.bicep_variant }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "file=fixed" >> "$GITHUB_OUTPUT"
          else
            echo "file=broken" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ steps.variant.outputs.file }}.bicep
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RG }}
          template: infra/${{ steps.variant.outputs.file }}.bicep
          parameters: >
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            kvAdminObjectId=${{ secrets.KV_ADMIN_OBJECT_ID }}
          failOnStdErr: false

  # ── 3. Zip-deploy the .NET app to App Service ─────────────────────────────
  deploy-app:
    name: Deploy App Service
    runs-on: ubuntu-latest
    needs: [build, deploy-infra]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-zip

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infra.outputs.app_name }}
          package: app.zip

  # ── 4. Deploy frontend to Static Web Apps ────────────────────────────────
  deploy-frontend:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    needs: deploy-infra
    permissions:
      id-token: write
      contents: read
    env:
      API_BASE: ${{ needs.deploy-infra.outputs.apim_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject API base URL
        run: |
          sed -i "s|__API_BASE__|${API_BASE}|g" frontend/index.html frontend/submit.html

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: swa-token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ needs.deploy-infra.outputs.swa_name }} \
            --resource-group ${{ vars.AZURE_RG }} \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: ''
          skip_api_build: true
